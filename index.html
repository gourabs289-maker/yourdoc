<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YourDoc — Rich Text to PDF</title>

  <!-- Clean Web Font with Light (300), Regular (400), and Bold (700) weights -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Quill Editor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />

  <!-- Your Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand">YourDoc</div>
      <input
        type="text"
        id="doc-title"
        class="doc-input"
        placeholder="Document filename..."
        value="My-Document"
        aria-label="Document filename"
      />
    </div>
    <div class="actions">
      <!-- View Mode Dropdown -->
      <div class="view-picker" id="view-picker" title="Switch Page View">
        <button type="button" class="view-picker-trigger" id="view-picker-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="view-picker-label">Desktop</span>
          <span class="dropdown-caret">&#9662;</span>
        </button>
        <div class="view-picker-menu" id="view-picker-menu" role="listbox">
          <div class="view-option" data-view="mobile">Mobile View</div>
          <div class="view-option" data-view="fullpage">Full Page View</div>
          <div class="view-option" data-view="desktop">Desktop View</div>
        </div>
      </div>

      <span id="page-counter" class="page-badge">Page 1</span>
      <button id="generate-pdf-btn" class="btn-pdf">Generate PDF</button>
    </div>
  </header>

  <!-- Formatting Toolbar & Date / Author Controls -->
  <div class="controls-wrapper">
    <div id="toolbar-container">
      <!-- Undo & Redo -->
      <span class="ql-formats">
        <button type="button" id="undo-btn" class="custom-toolbar-btn" title="Undo" aria-label="Undo">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
        </button>
        <button type="button" id="redo-btn" class="custom-toolbar-btn" title="Redo" aria-label="Redo">
          <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
        </button>
      </span>

      <span class="ql-formats">
        <select class="ql-header" title="Paragraph Style">
          <option value="1">Heading 1</option>
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option selected>Normal</option>
        </select>

        <select class="ql-font" title="Font Style">
          <option value="Roboto" selected></option>
          <option value="Arial"></option>
          <option value="Times New Roman"></option>
          <option value="Georgia"></option>
          <option value="Verdana"></option>
          <option value="Courier New"></option>
        </select>

        <!-- Custom Mobile-Safe Font Size Dropdown -->
        <div class="custom-size-picker" id="custom-size-picker" title="Font Size">
          <div class="size-picker-trigger" id="size-picker-trigger" role="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="size-picker-label">16px</span>
            <span class="size-picker-arrow">&#9662;</span>
          </div>
          <div class="size-picker-menu" id="size-picker-menu" role="listbox">
            <div class="size-option" data-size="10px">10px</div>
            <div class="size-option" data-size="12px">12px</div>
            <div class="size-option" data-size="14px">14px</div>
            <div class="size-option active" data-size="16px">16px</div>
            <div class="size-option" data-size="18px">18px</div>
            <div class="size-option" data-size="22px">22px</div>
            <div class="size-option" data-size="28px">28px</div>
            <div class="size-option" data-size="36px">36px</div>
          </div>
        </div>
      </span>

      <span class="ql-formats">
        <button class="ql-bold" title="Bold"></button>
        <button class="ql-italic" title="Italic"></button>
        <button class="ql-underline" title="Underline"></button>
        <button class="ql-strike" title="Strikethrough"></button>
      </span>

      <!-- Subscript & Superscript -->
      <span class="ql-formats">
        <button class="ql-script" value="sub" title="Subscript (e.g. O₂)"></button>
        <button class="ql-script" value="super" title="Superscript (e.g. x²)"></button>
      </span>

      <span class="ql-formats">
        <select class="ql-color" title="Text Color"></select>
        <select class="ql-background" title="Highlight Color"></select>
      </span>

      <span class="ql-formats">
        <button class="ql-list" value="bullet" title="Bullet Points"></button>
        <button class="ql-list" value="ordered" title="Numbered List"></button>
        <select class="ql-align" title="Text Alignment"></select>
      </span>

      <span class="ql-formats">
        <button class="ql-blockquote" title="Quote"></button>
        <button class="ql-image" title="Insert Image"></button>
        <button type="button" id="page-break-btn" class="custom-toolbar-btn" title="Insert Page Break" aria-label="Insert Page Break">
          <svg viewBox="0 0 24 24">
            <path d="M5 4h14v5H5z"/>
            <path d="M5 15h14v5H5z"/>
            <line x1="3" y1="12" x2="7" y2="12"/>
            <line x1="10" y1="12" x2="14" y2="12"/>
            <line x1="17" y1="12" x2="21" y2="12"/>
          </svg>
        </button>
        <button class="ql-clean" title="Clear Formatting"></button>
      </span>
    </div>

    <div class="meta-bar">
      <div class="meta-field">
        <label for="doc-date"><strong>Date:</strong></label>
        <input
          type="text"
          id="doc-date"
          placeholder="e.g., 22/11/2026"
        />
        <button type="button" id="today-btn" class="btn-today">Today</button>
      </div>

      <div class="meta-field">
        <label for="author-footer"><strong>Bottom Text / Author:</strong></label>
        <input
          type="text"
          id="author-footer"
          placeholder="e.g., Written by Gourab Saha"
        />
      </div>
    </div>
  </div>

  <!-- Document Workspace -->
  <main class="workspace" id="workspace">
    <div class="paper-scaler" id="paper-scaler">
      <div class="paper-stage" id="paper-stage">
        <div id="page-guides"></div>
        <div id="editor-container"></div>
      </div>
    </div>
  </main>

  <!-- Floating Image Resize Bar (appears when user taps an image) -->
  <div class="img-resize-bar" id="img-resize-bar" role="toolbar" aria-label="Image controls">
    <div class="img-bar-group">
      <button type="button" class="img-bar-btn" id="img-dec-btn" title="Decrease Image Size">−</button>
      <span class="img-size-readout" id="img-size-readout">100%</span>
      <button type="button" class="img-bar-btn" id="img-inc-btn" title="Increase Image Size">+</button>
    </div>
    <div class="img-bar-sep"></div>
    <div class="img-bar-group">
      <button type="button" class="img-bar-btn img-preset-btn" data-pct="25">25%</button>
      <button type="button" class="img-bar-btn img-preset-btn" data-pct="50">50%</button>
      <button type="button" class="img-bar-btn img-preset-btn" data-pct="75">75%</button>
      <button type="button" class="img-bar-btn img-preset-btn" data-pct="100">100%</button>
    </div>
    <div class="img-bar-sep"></div>
    <div class="img-bar-group">
      <button type="button" class="img-bar-btn img-align-btn" data-align="left" title="Align Left">Left</button>
      <button type="button" class="img-bar-btn img-align-btn" data-align="center" title="Align Center">Center</button>
      <button type="button" class="img-bar-btn img-align-btn" data-align="right" title="Align Right">Right</button>
    </div>
    <div class="img-bar-sep"></div>
    <div class="img-bar-group">
      <button type="button" class="img-bar-btn danger" id="img-delete-btn" title="Remove Image">Delete</button>
      <button type="button" class="img-bar-btn" id="img-done-btn" title="Close Controls">Done</button>
    </div>
  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Your Script -->
  <script src="script.js"></script>
  <script src="paint.js"></script>
</body>
</html>
