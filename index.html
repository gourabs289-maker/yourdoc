<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourDoc — Rich Text to PDF</title>

  <!-- Clean Web Font with Light (300), Regular (400), and Bold (700) weights -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Quill Editor CSS -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #eef1f5;
      color: #1f2937;
      -webkit-font-smoothing: antialiased;
    }

    /* Top App Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 120;
      background: #ffffff;
      border-bottom: 1px solid #d1d5db;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #2563eb;
      letter-spacing: -0.3px;
    }

    .doc-input {
      padding: 7px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      width: 175px;
    }

    .doc-input:focus { border-color: #2563eb; }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-badge {
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      background: #f3f4f6;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .btn-pdf {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-pdf:hover { background: #1d4ed8; }
    .btn-pdf:disabled { background: #93c5fd; cursor: wait; }

    /* Toolbar + Date & Footer Controls */
    .controls-wrapper {
      position: sticky;
      top: 57px;
      z-index: 110;
      background: #f8fafc;
      border-bottom: 1px solid #d1d5db;
    }

    #toolbar-container {
      position: relative;
      z-index: 115;
      border: none !important;
      border-bottom: 1px solid #e5e7eb !important;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      padding: 8px 10px !important;
    }

    /* Mobile-safe Custom Font Size Dropdown (never steals focus or hides behind page) */
    .custom-size-picker {
      position: relative;
      display: inline-flex;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      vertical-align: middle;
      margin-left: 4px;
    }

    .size-picker-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      height: 24px;
      min-width: 72px;
      padding: 0 8px;
      font-size: 14px;
      font-weight: 500;
      color: #444444;
      background: #ffffff;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1;
    }

    .size-picker-trigger:hover,
    .custom-size-picker.open .size-picker-trigger {
      color: #06c;
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .size-picker-arrow {
      font-size: 10px;
      opacity: 0.75;
    }

    .size-picker-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 96px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      padding: 4px 0;
      z-index: 500;
    }

    .custom-size-picker.open .size-picker-menu {
      display: block;
    }

    .size-option {
      padding: 8px 14px;
      font-size: 14px;
      color: #1f2937;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .size-option:hover {
      background: #eff6ff;
      color: #2563eb;
    }

    .size-option.active {
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 600;
    }

    .meta-bar {
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 8px 14px;
      font-size: 13px;
      color: #374151;
      flex-wrap: wrap;
    }

    .meta-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .meta-field input {
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
    }

    .meta-field input:focus { border-color: #2563eb; }

    #doc-date { width: 145px; }
    #author-footer { width: 230px; max-width: 100%; }

    .btn-today {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn-today:hover { background: #dbeafe; }

    /* Mobile: release sticky scroll for keyboard room while KEEPING high z-index */
    @media (max-width: 640px) {
      .topbar {
        position: relative;
        z-index: 120;
      }
      .controls-wrapper {
        position: relative;
        top: 0;
        z-index: 110;
      }
    }

    /* Ensure all Quill dropdown popups stay above everything */
    .ql-snow .ql-picker-options {
      z-index: 500 !important;
    }

    /* Workspace & A4 Page Simulation */
    .workspace {
      position: relative;
      z-index: 1;
      padding: 24px 12px 60px;
      overflow-x: auto;
    }

    .paper-stage {
      position: relative;
      width: 794px; /* A4 width at 96 DPI */
      min-height: 1123px; /* A4 height at 96 DPI */
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      border-radius: 2px;
    }

    /* Visual Page Guides (Page Numbers, Date & Author Footer Preview) */
    #page-guides {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .page-guide-slot {
      position: relative;
      width: 100%;
      height: 1123px;
      border-bottom: 2px dashed #cbd5e1;
    }

    .page-guide-slot:last-child { border-bottom: none; }

    .page-guide-footer {
      position: absolute;
      bottom: 18px;
      left: 56px;
      right: 56px;
      padding-top: 8px;
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #6b7280;
      font-family: "Roboto", Arial, sans-serif;
    }

    .footer-left { text-align: left; }
    .footer-center { text-align: center; }
    .footer-right { text-align: right; }

    /* Quill Editor Area overlaid on Paper */
    #editor-container {
      position: relative;
      z-index: 2;
      border: none !important;
      min-height: 1123px;
      background: transparent;
      font-family: "Roboto", Arial, sans-serif;
    }

    #editor-container .ql-editor {
      min-height: 1123px;
      padding: 56px 56px 90px 56px;
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      overflow-y: visible;
      -webkit-font-smoothing: antialiased;
    }

    #editor-container .ql-editor img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 10px 0;
    }

    /* Optical Fix: Keep large font sizes sleek instead of looking semi-bold */
    .ql-editor span[style*="font-size: 22px"],
    .ql-editor span[style*="font-size:22px"],
    .ql-editor span[style*="font-size: 28px"],
    .ql-editor span[style*="font-size:28px"],
    .ql-editor span[style*="font-size: 36px"],
    .ql-editor span[style*="font-size:36px"],
    .pdf-export-wrapper span[style*="font-size: 22px"],
    .pdf-export-wrapper span[style*="font-size:22px"],
    .pdf-export-wrapper span[style*="font-size: 28px"],
    .pdf-export-wrapper span[style*="font-size:28px"],
    .pdf-export-wrapper span[style*="font-size: 36px"],
    .pdf-export-wrapper span[style*="font-size:36px"] {
      font-weight: 300;
    }

    /* Preserve real Bold when user clicks the B button */
    .ql-editor strong,
    .ql-editor strong span,
    .ql-editor b,
    .ql-editor b span,
    .pdf-export-wrapper strong,
    .pdf-export-wrapper strong span,
    .pdf-export-wrapper b,
    .pdf-export-wrapper b span {
      font-weight: 700 !important;
    }

    /* Custom Font Family Labels in Quill Dropdown */
    .ql-snow .ql-picker.ql-font { width: 126px; }
    .ql-snow .ql-picker.ql-font .ql-picker-label::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item::before { content: 'Roboto'; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Roboto"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Roboto"]::before { content: 'Roboto'; font-family: "Roboto", sans-serif; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Arial"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Arial"]::before { content: 'Arial'; font-family: Arial, sans-serif; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Times New Roman"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Times New Roman"]::before { content: 'Times New Roman'; font-family: "Times New Roman", serif; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Georgia"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Georgia"]::before { content: 'Georgia'; font-family: Georgia, serif; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Verdana"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Verdana"]::before { content: 'Verdana'; font-family: Verdana, sans-serif; }

    .ql-snow .ql-picker.ql-font .ql-picker-label[data-value="Courier New"]::before,
    .ql-snow .ql-picker.ql-font .ql-picker-item[data-value="Courier New"]::before { content: 'Courier New'; font-family: "Courier New", monospace; }

    /* Clean PDF Export Rules */
    .pdf-export-wrapper {
      width: 180mm;
      background: #ffffff;
      color: #111827;
      font-family: "Roboto", Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .pdf-export-wrapper .ql-editor {
      padding: 0;
      overflow: visible;
      font-family: "Roboto", Arial, sans-serif;
    }

    .pdf-export-wrapper img,
    .pdf-export-wrapper h1,
    .pdf-export-wrapper h2,
    .pdf-export-wrapper h3,
    .pdf-export-wrapper li {
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .pdf-export-wrapper img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand-group">
      <div class="brand">YourDoc</div>
      <input
        type="text"
        id="doc-title"
        class="doc-input"
        placeholder="Document filename..."
        value="My-Document"
        aria-label="Document filename"
      />
    </div>
    <div class="actions">
      <span id="page-counter" class="page-badge">Page 1</span>
      <button id="generate-pdf-btn" class="btn-pdf">Generate PDF</button>
    </div>
  </header>

  <!-- Formatting Toolbar & Date / Author Controls -->
  <div class="controls-wrapper">
    <div id="toolbar-container">
      <span class="ql-formats">
        <select class="ql-header" title="Paragraph Style">
          <option value="1">Heading 1</option>
          <option value="2">Heading 2</option>
          <option value="3">Heading 3</option>
          <option selected>Normal</option>
        </select>

        <select class="ql-font" title="Font Style">
          <option value="Roboto" selected></option>
          <option value="Arial"></option>
          <option value="Times New Roman"></option>
          <option value="Georgia"></option>
          <option value="Verdana"></option>
          <option value="Courier New"></option>
        </select>

        <!-- Custom Mobile-Safe Font Size Dropdown -->
        <div class="custom-size-picker" id="custom-size-picker" title="Font Size">
          <div class="size-picker-trigger" id="size-picker-trigger" role="button" aria-haspopup="listbox" aria-expanded="false">
            <span id="size-picker-label">16px</span>
            <span class="size-picker-arrow">&#9662;</span>
          </div>
          <div class="size-picker-menu" id="size-picker-menu" role="listbox">
            <div class="size-option" data-size="10px">10px</div>
            <div class="size-option" data-size="12px">12px</div>
            <div class="size-option" data-size="14px">14px</div>
            <div class="size-option active" data-size="16px">16px</div>
            <div class="size-option" data-size="18px">18px</div>
            <div class="size-option" data-size="22px">22px</div>
            <div class="size-option" data-size="28px">28px</div>
            <div class="size-option" data-size="36px">36px</div>
          </div>
        </div>
      </span>

      <span class="ql-formats">
        <button class="ql-bold" title="Bold"></button>
        <button class="ql-italic" title="Italic"></button>
        <button class="ql-underline" title="Underline"></button>
        <button class="ql-strike" title="Strikethrough"></button>
      </span>

      <span class="ql-formats">
        <select class="ql-color" title="Text Color"></select>
        <select class="ql-background" title="Highlight Color"></select>
      </span>

      <span class="ql-formats">
        <button class="ql-list" value="bullet" title="Bullet Points"></button>
        <button class="ql-list" value="ordered" title="Numbered List"></button>
        <select class="ql-align" title="Text Alignment"></select>
      </span>

      <span class="ql-formats">
        <button class="ql-blockquote" title="Quote"></button>
        <button class="ql-image" title="Insert Image"></button>
        <button class="ql-clean" title="Clear Formatting"></button>
      </span>
    </div>

    <div class="meta-bar">
      <div class="meta-field">
        <label for="doc-date"><strong>Date:</strong></label>
        <input
          type="text"
          id="doc-date"
          placeholder="e.g., 22/11/2026"
        />
        <button type="button" id="today-btn" class="btn-today">Today</button>
      </div>

      <div class="meta-field">
        <label for="author-footer"><strong>Bottom Text / Author:</strong></label>
        <input
          type="text"
          id="author-footer"
          placeholder="e.g., Written by Gourab Saha"
        />
      </div>
    </div>
  </div>

  <!-- Document Workspace -->
  <main class="workspace">
    <div class="paper-stage" id="paper-stage">
      <div id="page-guides"></div>
      <div id="editor-container"></div>
    </div>
  </main>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    // 1. Register Inline Style Attributors so PDF exports exact fonts & sizes
    const SizeStyle = Quill.import('attributors/style/size');
    SizeStyle.whitelist = ['10px', '12px', '14px', '16px', '18px', '22px', '28px', '36px'];
    Quill.register(SizeStyle, true);

    const FontStyle = Quill.import('attributors/style/font');
    FontStyle.whitelist = ['Roboto', 'Arial', 'Times New Roman', 'Georgia', 'Verdana', 'Courier New'];
    Quill.register(FontStyle, true);

    // 2. Initialize Rich Text Editor
    const quill = new Quill('#editor-container', {
      theme: 'snow',
      placeholder: 'Start typing or paste your text, numbers, and images here...',
      modules: {
        toolbar: '#toolbar-container'
      }
    });

    const toolbarEl = document.getElementById('toolbar-container');
    const editorEl = document.querySelector('#editor-container .ql-editor');

    // Prevent toolbar taps from stealing focus and clearing blue text highlights
    toolbarEl.addEventListener('mousedown', (e) => {
      e.preventDefault();
    });

    // 3. Mobile-Safe Selection Memory + Font Size Dropdown + Gboard Typing Lock
    const sizePicker = document.getElementById('custom-size-picker');
    const sizeTrigger = document.getElementById('size-picker-trigger');
    const sizeLabel = document.getElementById('size-picker-label');
    const sizeOptions = document.querySelectorAll('.size-option');

    let savedRange = { index: 0, length: 0 };
    let activeSize = '16px';
    let sizeLocked = false;
    let lockedCursorIndex = null;
    let isComposing = false;
    let compStartIndex = null;
    let isFormattingInternally = false;

    function updateSizeDropdownUI(size) {
      const displaySize = size || '16px';
      sizeLabel.textContent = displaySize;
      sizeOptions.forEach((opt) => {
        opt.classList.toggle('active', opt.dataset.size === displaySize);
      });
    }

    function closeSizeMenu() {
      sizePicker.classList.remove('open');
      sizeTrigger.setAttribute('aria-expanded', 'false');
    }

    // Track the latest non-null selection inside the editor
    quill.on('selection-change', (range, oldRange, source) => {
      if (!range) return;

      savedRange = { index: range.index, length: range.length };

      if (source === 'user') {
        // Keep locked size if user taps back on the exact same cursor spot
        if (sizeLocked && range.length === 0 && range.index === lockedCursorIndex) {
          quill.format('size', activeSize, 'silent');
          updateSizeDropdownUI(activeSize);
          return;
        }

        // Otherwise sync dropdown to the text at the new cursor/selection
        sizeLocked = false;
        lockedCursorIndex = null;
        const currentFormat = quill.getFormat(range);
        activeSize = currentFormat.size || '16px';
        updateSizeDropdownUI(activeSize);
      }
    });

    // Toggle Font Size dropdown without dropping highlight
    sizeTrigger.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const current = quill.getSelection();
      if (current) {
        savedRange = { index: current.index, length: current.length };
      }
      const isOpen = sizePicker.classList.toggle('open');
      sizeTrigger.setAttribute('aria-expanded', String(isOpen));
    });

    // Apply chosen Font Size cleanly to selected text OR lock for new typing
    sizeOptions.forEach((opt) => {
      opt.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();

        const newSize = opt.dataset.size;
        closeSizeMenu();

        const current = quill.getSelection();
        const target = current ? current : savedRange;

        activeSize = newSize;
        updateSizeDropdownUI(newSize);

        if (target && target.length > 0) {
          // Resize highlighted word(s) and keep them selected
          sizeLocked = false;
          lockedCursorIndex = null;
          isFormattingInternally = true;
          quill.formatText(target.index, target.length, 'size', newSize, 'user');
          quill.setSelection(target.index, target.length, 'silent');
          isFormattingInternally = false;
          savedRange = { index: target.index, length: target.length };
        } else {
          // Lock chosen size at blinking cursor so mobile keyboard won't reset to 16px
          const cursorIdx = target ? target.index : Math.max(0, quill.getLength() - 1);
          sizeLocked = true;
          lockedCursorIndex = cursorIdx;
          isFormattingInternally = true;
          quill.setSelection(cursorIdx, 0, 'silent');
          quill.format('size', newSize, 'silent');
          isFormattingInternally = false;
          savedRange = { index: cursorIdx, length: 0 };
        }
      });
    });

    // Close dropdown when tapping anywhere outside it
    document.addEventListener('pointerdown', (e) => {
      if (!sizePicker.contains(e.target)) {
        closeSizeMenu();
      }
    });

    // Reset size lock if user clicks Clear Formatting button
    const cleanBtn = document.querySelector('.ql-clean');
    if (cleanBtn) {
      cleanBtn.addEventListener('click', () => {
        sizeLocked = false;
        lockedCursorIndex = null;
        activeSize = '16px';
        updateSizeDropdownUI('16px');
      });
    }

    // Handle Android predictive keyboard (IME composition) without breaking words
    editorEl.addEventListener('compositionstart', () => {
      isComposing = true;
      const cur = quill.getSelection();
      compStartIndex = cur ? cur.index : savedRange.index;
    });

    editorEl.addEventListener('compositionend', () => {
      isComposing = false;
      if (!sizeLocked || compStartIndex === null) {
        compStartIndex = null;
        return;
      }

      const startIdx = compStartIndex;
      compStartIndex = null;

      setTimeout(() => {
        const cur = quill.getSelection();
        const endIdx = cur ? cur.index : startIdx;
        if (endIdx > startIdx) {
          isFormattingInternally = true;
          quill.formatText(startIdx, endIdx - startIdx, 'size', activeSize, 'silent');
          quill.format('size', activeSize, 'silent');
          isFormattingInternally = false;
          lockedCursorIndex = endIdx;
          savedRange = { index: endIdx, length: 0 };
        }
      }, 0);
    });

    // Enforce locked font size on direct character typing (numbers, spaces, desktop typing)
    quill.on('text-change', (delta, oldDelta, source) => {
      updatePageGuides();

      if (source !== 'user' || isFormattingInternally || isComposing || !sizeLocked) {
        return;
      }

      let index = 0;
      const rangesToFormat = [];

      for (const op of delta.ops) {
        if (typeof op.retain === 'number') {
          index += op.retain;
        } else if (typeof op.insert === 'string') {
          const len = op.insert.length;
          if (op.insert !== '\n' && (!op.attributes || op.attributes.size !== activeSize)) {
            rangesToFormat.push({ index, length: len });
          }
          index += len;
        } else if (op.insert) {
          index += 1;
        }
      }

      if (rangesToFormat.length > 0) {
        isFormattingInternally = true;
        rangesToFormat.forEach((r) => {
          quill.formatText(r.index, r.length, 'size', activeSize, 'silent');
        });
        quill.format('size', activeSize, 'silent');
        isFormattingInternally = false;
      } else {
        quill.format('size', activeSize, 'silent');
      }

      const cur = quill.getSelection();
      if (cur) {
        lockedCursorIndex = cur.index;
        savedRange = { index: cur.index, length: cur.length };
      }
    });

    // 4. Live Footer Preview (Page Number Left | Date Center | Author Right)
    const PAGE_HEIGHT = 1123; // A4 height at 96 DPI
    const pageGuides = document.getElementById('page-guides');
    const paperStage = document.getElementById('paper-stage');
    const pageCounter = document.getElementById('page-counter');
    const authorInput = document.getElementById('author-footer');
    const dateInput = document.getElementById('doc-date');
    const todayBtn = document.getElementById('today-btn');

    todayBtn.addEventListener('click', () => {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      dateInput.value = `${dd}/${mm}/${yyyy}`;
      updatePageGuides();
    });

    function updatePageGuides() {
      const contentHeight = editorEl.scrollHeight;
      const totalPages = Math.max(1, Math.ceil(contentHeight / PAGE_HEIGHT));
      const authorText = authorInput.value.trim();
      const dateText = dateInput.value.trim();

      paperStage.style.minHeight = `${totalPages * PAGE_HEIGHT}px`;
      pageCounter.textContent = totalPages === 1 ? 'Page 1' : `${totalPages} Pages`;

      let guidesHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        guidesHTML += `
          <div class="page-guide-slot">
            <div class="page-guide-footer">
              <span class="footer-left">Page ${i}</span>
              <span class="footer-center">${dateText ? 'Date: ' + escapeHtml(dateText) : ''}</span>
              <span class="footer-right">${escapeHtml(authorText)}</span>
            </div>
          </div>
        `;
      }
      pageGuides.innerHTML = guidesHTML;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const resizeObserver = new ResizeObserver(updatePageGuides);
    resizeObserver.observe(editorEl);
    authorInput.addEventListener('input', updatePageGuides);
    dateInput.addEventListener('input', updatePageGuides);
    updatePageGuides();

    // 5. Generate & Download PDF with Page Number, Date, and Author on Every Page Footer
    const generateBtn = document.getElementById('generate-pdf-btn');

    generateBtn.addEventListener('click', async () => {
      const rawTitle = document.getElementById('doc-title').value.trim() || 'yourdoc-document';
      const safeFileName = rawTitle.replace(/[^a-zA-Z0-9-_ ]/g, '').trim() || 'yourdoc-document';
      const authorText = authorInput.value.trim();
      const dateText = dateInput.value.trim();

      generateBtn.disabled = true;
      generateBtn.textContent = 'Generating PDF...';

      const exportWrapper = document.createElement('div');
      exportWrapper.className = 'ql-snow pdf-export-wrapper';

      const exportContent = document.createElement('div');
      exportContent.className = 'ql-editor';
      exportContent.innerHTML = editorEl.innerHTML;
      exportWrapper.appendChild(exportContent);

      const options = {
        margin: [15, 15, 22, 15], // [top, left, bottom, right] in mm
        filename: `${safeFileName}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, letterRendering: true },
        pagebreak: { mode: ['css', 'legacy'] },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      try {
        await html2pdf()
          .set(options)
          .from(exportWrapper)
          .toPdf()
          .get('pdf')
          .then((pdf) => {
            const totalPages = pdf.internal.getNumberOfPages();
            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();

            for (let i = 1; i <= totalPages; i++) {
              pdf.setPage(i);

              // Subtle horizontal footer divider line
              pdf.setDrawColor(215, 215, 215);
              pdf.setLineWidth(0.25);
              pdf.line(15, pageHeight - 15, pageWidth - 15, pageHeight - 15);

              // Footer typography
              pdf.setFont('helvetica', 'normal');
              pdf.setFontSize(9.5);
              pdf.setTextColor(95, 95, 95);

              // Bottom-Left: Automatic Page Number
              pdf.text(`Page ${i}`, 15, pageHeight - 9);

              // Bottom-Center: Custom Date on Every Page
              if (dateText) {
                pdf.text(`Date: ${dateText}`, pageWidth / 2, pageHeight - 9, { align: 'center' });
              }

              // Bottom-Right: Custom Author Name / Footer Text on Every Page
              if (authorText) {
                pdf.text(authorText, pageWidth - 15, pageHeight - 9, { align: 'right' });
              }
            }
          })
          .save();
      } catch (err) {
        alert('Could not generate PDF. If you pasted an image from another website, try uploading it using the toolbar image button instead.');
        console.error(err);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate PDF';
      }
    });
  </script>
</body>
</html>
